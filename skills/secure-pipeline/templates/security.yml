# Security pipeline: secrets, SAST, SCA, IaC, (optional) container image + DAST.
# Results land in the GitHub Security tab via SARIF. Every action is pinned to a commit SHA.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: new CVEs appear without code changes

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Scan
        run: ./gitleaks git . --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.182.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan
        env:
          # Event data goes through env, never ${{ }} inside run: (script injection).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args="--config p/default --metrics=off --sarif --output semgrep.sarif --error"
          [ -d .semgrep ] && args="$args --config .semgrep"
          # On PRs only block on findings the PR introduces.
          [ -n "$BASE_SHA" ] && args="$args --baseline-commit $BASE_SHA"
          semgrep scan $args
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: .
          severity-cutoff: high
          only-fixed: true # block only when an upgrade exists
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0 (checkov 3.3.30)
        with:
          directory: .
          quiet: true
          output_format: cli,sarif
          output_file_path: console,results.sarif
          hard_fail_on: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: results.sarif
          category: checkov

  # --- Keep the jobs below only if the repo builds a container image (Dockerfile). ---

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfile policy (OPA / Conftest)
        run: docker run --rm -v "$PWD:/project" -w /project openpolicyagent/conftest:v0.71.1 test Dockerfile --policy policy/
      - name: Build
        run: docker build -t app:${{ github.sha }} . # DOCKERFILE_DIR
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:${{ github.sha }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  dast:
    # Passive baseline scan of the app running inside the runner. Report-only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start app
        run: |
          docker build -t app:dast . # DOCKERFILE_DIR
          docker run -d -p 8080:APP_PORT app:dast
          for i in $(seq 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 2; done
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          allow_issue_writing: false
          fail_action: false
